# platform.ask-palestine.com → Api on 127.0.0.1:5100 (deploy/docker-compose.prod.yml).
# Install: docs/operations.md, "The test server", step 3. TLS between Cloudflare and this server uses a Cloudflare
# Origin certificate, as the server's other sites do — not certbot.
#
# PLACEHOLDER until checked against the server's existing site files: the two certificate paths below, and anything
# else those files do differently. Step 3 of the runbook says how to compare.

server {
    listen 80;
    listen [::]:80;
    server_name platform.ask-palestine.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platform.ask-palestine.com;

    # PLACEHOLDER: the Cloudflare Origin certificate and key the other ask-palestine.com sites use.
    ssl_certificate     /etc/ssl/cloudflare/ask-palestine.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ask-palestine.com.key;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;

        # Api checks Host (AllowedHosts) and Origin (CSRF) — both must arrive as the browser sent them.
        proxy_set_header Host $host;
        # Api does not read these yet: it sees nginx as every client's address (OPEN_ITEMS 85).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
