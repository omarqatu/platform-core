# platform.ask-palestine.com → Api on 127.0.0.1:5100 (deploy/docker-compose.prod.yml).
# Install: docs/operations.md, "The test server", step 3. TLS between Cloudflare and this server uses a Cloudflare
# Origin certificate, as the server's other sites do — not certbot.
#
# The certificate is the server's existing Cloudflare Origin certificate — a wildcard (SAN *.ask-palestine.com and
# ask-palestine.com), so it covers this name with no issuance. Valid ONLY behind Cloudflare's proxy (orange cloud):
# browsers reject it directly. nginx's master process (root) loads it, never the workers — step 3 of the runbook.

server {
    listen 80;
    listen [::]:80;
    server_name platform.ask-palestine.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platform.ask-palestine.com;

    # Where they are today. The runbook (step 3) recommends moving both to /etc/ssl/cloudflare/, root:root 600 —
    # then these two lines change with them.
    ssl_certificate     /home/supersetadmin/ssl/cloudflare/ask-palestine-cert.pem;
    ssl_certificate_key /home/supersetadmin/ssl/cloudflare/ask-palestine-key.pem;

    # The client's real address (OPEN_ITEMS 85). Behind Cloudflare, nginx's peer is a Cloudflare edge, and the client
    # is in CF-Connecting-IP. That header is believed ONLY when the connection comes from one of Cloudflare's
    # published ranges below; from anywhere else (someone reaching this server directly, past Cloudflare) $remote_addr
    # stays the real peer, whatever the header says. Api's attempt limiter keys on this address and auth_attempts
    # records it, so it must be the client's and must not be the client's to choose.
    # Cloudflare's list, as published on 2026-10-19 — https://www.cloudflare.com/ips-v4 and /ips-v6. It changes rarely;
    # the runbook (step 3) says how to compare it.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;

        # Api checks Host (AllowedHosts) and Origin (CSRF) — both must arrive as the browser sent them.
        proxy_set_header Host $host;
        # REPLACED, never appended ($proxy_add_x_forwarded_for would keep what the client sent): Api believes this
        # header from nginx alone (Network:TrustedProxies) and reads one entry — this one.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Whatever the client sent under these names never reaches Api.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Real-IP "";

        proxy_read_timeout 60s;
    }
}
