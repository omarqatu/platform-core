# Development and CI database. Passwords below are for local containers only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      PLATFORM_DB: platform
      # CI generates a random value per run (T0.3 searches the Api image for it).
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator_dev}
      APP_USER_PASSWORD: app_user_dev
      AUTHENTICATOR_PASSWORD: authenticator_dev
      JOB_RUNNER_PASSWORD: job_runner_dev
      PROVISIONER_PASSWORD: provisioner_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the temporary server that runs the init scripts listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The e-mail the tests read (group ب). Mailpit accepts SMTP on 1025 and serves what it caught over HTTP on
  # 8025, so an e2e can follow an invitation's real link instead of the token the API also returns — which is
  # the whole point of OPEN_ITEMS 60: a test that reads the response bypasses the part the item exists for.
  # Development and CI only; nothing in deploy/ refers to it.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
