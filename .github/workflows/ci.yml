name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PlatformCore.slnx -c Release

      # A fresh migrator password per run: the T0.3 scan searches the Api image
      # for this exact value. Every holder of the migrator connection string
      # (the migration tool, the test suites) takes it from the environment.
      - name: Generate the migrator password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MIGRATOR_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ConnectionStrings__migrator=Host=localhost;Port=5432;Database=platform;Username=migrator;Password=$password" >> "$GITHUB_ENV"

      # Always a fresh container: T0.4 is a clean database, migrated with no manual steps.
      - name: Start PostgreSQL 18 (clean database)
        run: docker compose up -d --wait postgres

      - name: Migrate as migrator (T0.4)
        run: dotnet run --project src/Migrations -c Release --no-build

      # PLATFORM_CORE §3.6: the ten checks, then each seen failing on its plant (PROOF_SPEC T2.2).
      # Before any test step, so no test fixture can ever be seen by a catalog check.
      # The local check-schema-allowlist runs beside them: a repository check with a name, never a
      # number — not one of PLATFORM_CORE's ten (checks/local/README.md).
      - name: Catalog checks — Checks 1-10, and the local check-schema-allowlist
        run: |
          bash checks/core/run-checks.sh
          bash checks/local/check-schema-allowlist.sh

      - name: Catalog checks — each fails on its plant (T2.2), the local check included
        run: |
          bash checks/core/run-checks.sh --self-test
          bash checks/local/check-schema-allowlist.sh --self-test

      - name: Build Api image
        run: docker build -f src/Api/Dockerfile -t platform-api:ci .

      - name: Api holds no migrator connection string (T0.3)
        run: bash ci/check-api-has-no-migrator.sh platform-api:ci

      - name: T0.3 check fails on every planted case (self-test)
        run: bash ci/check-api-has-no-migrator.selftest.sh platform-api:ci

      # PROOF_SPEC §7: the seed contract, seeded by migrator before the tests (after the catalog checks).
      - name: Seed the contract (migrator)
        run: docker compose exec -T postgres psql -X -q -v ON_ERROR_STOP=1 -U migrator -d platform < tests/seed/seed-contract.sql

      # [W] proofs for this implementation only (tests/Core.WhiteBoxTests/README.md).
      - name: White-box tests
        run: dotnet test tests/Core.WhiteBoxTests -c Release --no-build --logger "console;verbosity=normal"

      # PROOF_SPEC T3: the [B] tests reach the system over HTTP too — the Api image built above, run as a
      # container with its three connection strings (never migrator's). Plain HTTP on the runner's loopback,
      # so the cookie's Secure flag is relaxed for this run only (Session:RequireHttps; the default is on) —
      # which Api allows only in an environment named Development or CI, hence ASPNETCORE_ENVIRONMENT=CI.
      - name: Start the Api (the image built above)
        run: |
          docker run -d --name api --network host \
            -e ASPNETCORE_URLS=http://127.0.0.1:5080 \
            -e ASPNETCORE_ENVIRONMENT=CI \
            -e Session__RequireHttps=false \
            -e "ConnectionStrings__app_user=Host=localhost;Port=5432;Database=platform;Username=app_user;Password=app_user_dev" \
            -e "ConnectionStrings__authenticator=Host=localhost;Port=5432;Database=platform;Username=authenticator;Password=authenticator_dev" \
            -e "ConnectionStrings__provisioner=Host=localhost;Port=5432;Database=platform;Username=provisioner;Password=provisioner_dev" \
            platform-api:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/tenants || true)"
            [ "$code" = "401" ] && exit 0
            sleep 1
          done
          docker logs api
          exit 1

      - name: Conformance
        run: dotnet test tests/Conformance -c Release --no-build --logger "console;verbosity=normal"

      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Api logs on failure
        if: failure()
        run: docker logs api || true
