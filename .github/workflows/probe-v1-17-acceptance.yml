# The rule-11 run of the v1.17 acceptance proposal (docs/proposals/v1.17-acceptance) on PostgreSQL 18 — a probe, not
# part of CI: it runs on this branch only, and is removed before the build (phase B) is proposed for merge.
# Two variants, each on its own database: the draft (P1–P4) and alternative B (P3 and accept_invitation()).
name: probe v1.17 acceptance

on:
  push:
    branches: [claude/i18n-setup-ar-en-d8dhv1]
    paths: ['docs/proposals/v1.17-acceptance/**', '.github/workflows/probe-v1-17-acceptance.yml']
  workflow_dispatch:

jobs:
  # Every case alone, as its role, rolled back; the races; both directions — then the ten checks on the variant.
  sql-both-directions:
    strategy:
      fail-fast: false
      matrix:
        variant: [draft, altb]
    name: sql-both-directions (${{ matrix.variant }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the migration tool
        run: dotnet build src/Migrations -c Release
      - name: Migrator password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MIGRATOR_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ConnectionStrings__migrator=Host=localhost;Port=5432;Database=platform;Username=migrator;Password=$password" >> "$GITHUB_ENV"
      - name: PostgreSQL 18, migrated and seeded (as CI builds it)
        run: |
          docker compose up -d --wait postgres
          dotnet run --project src/Migrations -c Release --no-build
          docker compose exec -T postgres psql -X -q -v ON_ERROR_STOP=1 -U migrator -d platform < tests/seed/seed-contract.sql
      - name: The cases and the races — baseline (v1.16), then the variant
        run: bash docs/proposals/v1.17-acceptance/run.sh ${{ matrix.variant }}
      - name: The ten checks on the variant — as they are, then with its inputs
        if: always()
        run: bash docs/proposals/v1.17-acceptance/checks-${{ matrix.variant }}.sh

  # What each variant breaks among the existing suites, through the real EF paths: a database carrying the parts
  # the current code can run on — the draft's P3 and P4 (P1 and P2 need the application to create the founding
  # invitation and record the acceptor: phase B), and B whole (P3 and the function; the code does not call it yet).
  ef-existing-suites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: draft-p3-p4
            parts: p3-one-account-per-address p4-membership-has-scope
          - variant: altb
            parts: p3-one-account-per-address b-accept-invitation
    name: ef-existing-suites (${{ matrix.variant }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build PlatformCore.slnx -c Release
      - name: Migrator password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MIGRATOR_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ConnectionStrings__migrator=Host=localhost;Port=5432;Database=platform;Username=migrator;Password=$password" >> "$GITHUB_ENV"
      - name: PostgreSQL 18, migrated, the variant applied, seeded
        run: |
          docker compose up -d --wait postgres
          dotnet run --project src/Migrations -c Release --no-build
          for p in ${{ matrix.parts }}; do
            docker compose exec -T postgres psql -X -q -v ON_ERROR_STOP=1 -U migrator -d platform < docs/proposals/v1.17-acceptance/$p.sql
            echo "applied $p"
          done
          docker compose exec -T postgres psql -X -q -v ON_ERROR_STOP=1 -U migrator -d platform < tests/seed/seed-contract.sql
      - name: White-box tests
        if: always()
        run: dotnet test tests/Core.WhiteBoxTests -c Release --no-build --logger "console;verbosity=normal"
      - name: Build and start the Api image
        if: always()
        run: |
          docker build -f src/Api/Dockerfile -t platform-api:probe .
          docker run -d --name api --network host \
            -e ASPNETCORE_URLS=http://127.0.0.1:5080 -e ASPNETCORE_ENVIRONMENT=CI -e Session__RequireHttps=false \
            -e Security__AllowedOrigins__0=http://127.0.0.1:5080 \
            -e "ConnectionStrings__app_user=Host=localhost;Port=5432;Database=platform;Username=app_user;Password=app_user_dev" \
            -e "ConnectionStrings__authenticator=Host=localhost;Port=5432;Database=platform;Username=authenticator;Password=authenticator_dev" \
            -e "ConnectionStrings__provisioner=Host=localhost;Port=5432;Database=platform;Username=provisioner;Password=provisioner_dev" \
            platform-api:probe
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/tenants || true)" = 401 ] && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Conformance
        if: always()
        run: dotnet test tests/Conformance -c Release --no-build --logger "console;verbosity=normal"
